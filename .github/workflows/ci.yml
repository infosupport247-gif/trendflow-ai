name: TrendFlow CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile backend/app/main.py backend/alembic/env.py backend/alembic/versions/0001_initial.py worker/worker.py worker/scheduler.py
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config
